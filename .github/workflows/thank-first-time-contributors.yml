name: Thank Contributors
on:
  pull_request_target:
    types:
      - closed

permissions:
  pull-requests: write
  issues: write

jobs:
  thank-contributor:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Post thank you comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;

            // Skip bots (dependabot, renovate, etc.)
            if (context.payload.pull_request.user.type === "Bot") {
              console.log(`Skipping bot author: ${author}`);
              return;
            }

            // Use search API for an accurate, paginated-safe count of
            // this author's merged PRs in this repo (includes the current one).
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:merged author:${author}`,
              per_page: 1
            });

            const isFirstContribution = data.total_count <= 1;

            const message = isFirstContribution
              ? `hey @${author}, really glad you took the time to contribute! your first PR just got merged and that genuinely means a lot to us 🎉

            hope this is just the beginning. feel free to pick up more issues whenever you're up for it, and if you're enjoying the project a ⭐ on the repo would be awesome`
              : `thanks @${author}, always good to see you back 🙌

            really appreciate you keeping at it, means a lot. grab another issue whenever you feel like it and keep the good stuff coming`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            });
